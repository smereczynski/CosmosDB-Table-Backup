name: On-demand backup and isolated restore

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: Existing committed backup UUID; empty runs backup before restore
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backup-operations-${{ github.repository }}
  cancel-in-progress: false

env:
  SUBSCRIPTION_ID: ${{ vars.AZURE_BACKUP_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  SOURCE_ACCOUNT_ID: ${{ vars.SOURCE_COSMOS_ACCOUNT_RESOURCE_ID }}
  BACKUP_JOB_NAME: ${{ vars.BACKUP_JOB_NAME }}
  RESTORE_JOB_NAME: ${{ vars.RESTORE_JOB_NAME }}
  REGISTRY_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment: backup-infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_BACKUP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
      - name: Ensure Container Apps job log tooling
        run: |
          if ! az containerapp job logs show --help >/dev/null 2>&1; then
            az extension add --name containerapp --version 1.3.0b5 --allow-preview true --only-show-errors
          fi
          az containerapp job logs show --help >/dev/null
      - name: Run governed backup and isolated restore
        env:
          INPUT_BACKUP_ID: ${{ inputs.backup_id }}
        run: python3 scripts/run-on-demand.py --backup-id "$INPUT_BACKUP_ID" --report smoke-result.json
      - name: Record sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-result-${{ github.run_id }}
          retention-days: 30
          path: smoke-result.json
          if-no-files-found: error
