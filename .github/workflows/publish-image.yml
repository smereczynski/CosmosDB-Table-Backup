name: Release job image

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Roll the immutable digest out to both Container Apps jobs
        required: true
        default: true
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: backup-operations-${{ github.repository }}
  cancel-in-progress: false

env:
  SUBSCRIPTION_ID: ${{ vars.AZURE_BACKUP_SUBSCRIPTION_ID }}
  TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  REGISTRY_NAME: ${{ vars.ACR_NAME }}
  REGISTRY_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  BACKUP_JOB_NAME: ${{ vars.BACKUP_JOB_NAME }}
  RESTORE_JOB_NAME: ${{ vars.RESTORE_JOB_NAME }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release configuration
        run: |
          : "${SUBSCRIPTION_ID:?Set AZURE_BACKUP_SUBSCRIPTION_ID in the release environment}"
          : "${TENANT_ID:?Set AZURE_TENANT_ID in the release environment}"
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP in the release environment}"
          : "${REGISTRY_NAME:?Set ACR_NAME in the release environment}"
          : "${REGISTRY_SERVER:?Set ACR_LOGIN_SERVER in the release environment}"
          : "${BACKUP_JOB_NAME:?Set BACKUP_JOB_NAME in the release environment}"
          : "${RESTORE_JOB_NAME:?Set RESTORE_JOB_NAME in the release environment}"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_RELEASE_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to ACR with OIDC identity
        run: az acr login --name "$REGISTRY_NAME"
      - name: Build and verify runtime image before publishing
        run: |
          tag="$REGISTRY_SERVER/cosmos-table-backup:${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 --tag "$tag" --load .
          IMAGE="$tag" ./scripts/smoke-test-image.sh
      - name: Build and push immutable image
        run: |
          tag="$REGISTRY_SERVER/cosmos-table-backup:${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true \
            --tag "$tag" --push --metadata-file image-metadata.json .
      - name: Record image digest
        id: image
        run: |
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' image-metadata.json)
          reference="$REGISTRY_SERVER/cosmos-table-backup@$digest"
          printf '%s\n' "$reference" > image-reference.txt
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      - name: Update backup and dormant restore jobs
        if: github.event_name == 'push' || inputs.deploy
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          ACR_LOGIN_SERVER: ${{ env.REGISTRY_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
        run: ./scripts/deploy-job-image.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-reference-${{ github.run_id }}
          retention-days: 90
          path: |
            image-reference.txt
            image-metadata.json

  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          printf "Container image: \`%s\`\n" "$IMAGE" > release-notes.md
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --notes-file release-notes.md
