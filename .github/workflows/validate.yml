name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          enable-cache: true
      - run: uv sync --frozen --all-extras --no-install-project --no-build
      - run: uv lock --check
      - run: uv run --frozen --no-sync --no-build ruff format --check .
      - run: uv run --frozen --no-sync --no-build ruff check .
      - run: uv run --frozen --no-sync --no-build mypy src
      - run: uv run --frozen --no-sync --no-build pytest --cov=cosmos_table_backup --cov-report=term-missing --cov-fail-under=90
      - run: uv run --frozen --no-sync --no-build pip-audit
      - run: uv run --frozen --no-sync --no-build bandit -q -r src

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: az bicep install
      - run: az bicep restore --file infra/main.bicep
      - run: az bicep lint --file infra/main.bicep
      - run: az bicep build --file infra/main.bicep
      - run: az bicep restore --file infra/deployment/production-integration.bicep
      - run: az bicep lint --file infra/deployment/production-integration.bicep
      - run: az bicep build --file infra/deployment/production-integration.bicep
      - run: az bicep build-params --file infra/parameters/nonprod.bicepparam --stdout > /dev/null

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: cosmos-table-backup:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root backup and restore image startup
        env:
          IMAGE: cosmos-table-backup:validation
        run: ./scripts/smoke-test-image.sh
