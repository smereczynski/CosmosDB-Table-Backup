name: Deploy backup platform

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable ACR image reference; empty preserves the live job image or uses the disabled bootstrap value
        required: false
        default: ''
        type: string
      enable_schedule:
        description: Enable the daily backup schedule after smoke validation
        required: true
        default: false
        type: boolean
      enable_restore_access:
        description: Grant governed manual restore access without enabling monthly scheduling
        required: true
        default: false
        type: boolean
      enable_restore_validation:
        description: Enable monthly restore access and schedule after isolated-target validation
        required: true
        default: false
        type: boolean
      apply:
        description: Apply after what-if and environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: backup-operations-${{ github.repository }}
  cancel-in-progress: false

env:
  SUBSCRIPTION_ID: ${{ vars.AZURE_BACKUP_SUBSCRIPTION_ID }}
  TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  SOURCE_ACCOUNT_ID: ${{ vars.SOURCE_COSMOS_ACCOUNT_RESOURCE_ID }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  BACKUP_JOB_NAME: ${{ vars.BACKUP_JOB_NAME }}
  REGISTRY_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: backup-infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve restore mode
        env:
          INPUT_RESTORE_ACCESS: ${{ inputs.enable_restore_access }}
          INPUT_ENABLE_RESTORE: ${{ inputs.enable_restore_validation }}
        run: bash scripts/resolve-restore-mode.sh
      - name: Validate deployment configuration
        run: |
          : "${SUBSCRIPTION_ID:?Set AZURE_BACKUP_SUBSCRIPTION_ID in the backup-infrastructure environment}"
          : "${TENANT_ID:?Set AZURE_TENANT_ID in the backup-infrastructure environment}"
          : "${SOURCE_ACCOUNT_ID:?Set SOURCE_COSMOS_ACCOUNT_RESOURCE_ID in the backup-infrastructure environment}"
          : "${LOCATION:?Set AZURE_LOCATION in the backup-infrastructure environment}"
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP in the backup-infrastructure environment}"
          : "${BACKUP_JOB_NAME:?Set BACKUP_JOB_NAME in the backup-infrastructure environment}"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_BACKUP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
      - name: Validate Bicep
        run: |
          az bicep restore --file infra/main.bicep
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout >/dev/null
      - name: What-if
        env:
          ALLOW_ROLE_ASSIGNMENT_CHANGES: '1'
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
        run: |
          set -euo pipefail
          image="$INPUT_IMAGE"
          if [[ -z "$image" ]] && az containerapp job show --resource-group "$RESOURCE_GROUP" \
            --name "$BACKUP_JOB_NAME" --output none 2>/dev/null; then
            image=$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$BACKUP_JOB_NAME" \
              --query 'properties.template.containers[0].image' --output tsv)
          fi
          if [[ -n "$image" ]]; then
            : "${REGISTRY_SERVER:?Set ACR_LOGIN_SERVER before using a deployed image}"
            prefix="$REGISTRY_SERVER/cosmos-table-backup@sha256:"
            digest=${image#"$prefix"}
            [[ "$image" == "$prefix"* && "$digest" =~ ^[0-9a-f]{64}$ ]] || {
              echo 'Image must be the expected ACR repository pinned by sha256 digest' >&2
              exit 1
            }
          elif [[ "$INPUT_ENABLE_SCHEDULE" == "true" || "$RESTORE_ACCESS_ENABLED" == "true" ]]; then
            echo 'A digest-pinned image is required before enabling a schedule or restore access' >&2
            exit 1
          fi
          printf '%s\n' "$image" > resolved-image.txt
          name="backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_args=()
          [[ -z "$image" ]] || image_args=(backupImage="$image")
          az deployment sub what-if --name "$name" --location "$LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/nonprod.bicepparam \
            --parameters "${image_args[@]}" sourceCosmosAccountResourceId="$SOURCE_ACCOUNT_ID" \
              scheduleEnabled="$INPUT_ENABLE_SCHEDULE" \
              restoreScheduleEnabled="$RESTORE_SCHEDULE_ENABLED" \
              restoreAccessEnabled="$RESTORE_ACCESS_ENABLED" \
            --result-format FullResourcePayloads --no-pretty-print --only-show-errors --output json > what-if.json
          # Azure CLI can emit whitespace before a UTF-8 BOM for an empty What-if response.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('what-if.json')
          payload = path.read_text(encoding='utf-8-sig').strip().lstrip('\ufeff').strip()
          path.write_text(payload or '[]\n')
          PY
          python3 scripts/guard-what-if.py
      - name: Upload what-if
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backup-what-if-${{ github.run_id }}
          retention-days: 30
          path: |
            what-if.json
            resolved-image.txt
      - name: Deploy
        if: inputs.apply
        env:
          INPUT_ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
        run: |
          set -euo pipefail
          name="backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image=$(cat resolved-image.txt)
          image_args=()
          [[ -z "$image" ]] || image_args=(backupImage="$image")
          az deployment sub create --name "$name" --location "$LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/nonprod.bicepparam \
            --parameters "${image_args[@]}" sourceCosmosAccountResourceId="$SOURCE_ACCOUNT_ID" \
              scheduleEnabled="$INPUT_ENABLE_SCHEDULE" \
              restoreScheduleEnabled="$RESTORE_SCHEDULE_ENABLED" \
              restoreAccessEnabled="$RESTORE_ACCESS_ENABLED" \
            --output json > deployment.json
      - name: Upload deployment outputs
        if: inputs.apply
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backup-deployment-${{ github.run_id }}
          retention-days: 30
          path: deployment.json
